name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Prepare Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Restoring permanent release keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
        elif [ ! -f release-key.jks ]; then
          echo "Generating fallback release key..."
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias ios-calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "iOSCalcRelease20261102" \
            -keypass "iOSCalcRelease20261102" \
            -dname "CN=Erfan Siavoshy"
        fi

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: "iOSCalcRelease20261102"
        KEY_PASSWORD: "iOSCalcRelease20261102"
        KEY_ALIAS: "ios-calculator"
      run: gradle :app:assembleRelease --stacktrace --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Calculator-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
