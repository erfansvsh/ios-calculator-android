name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Generate Release Signing Key
      run: |
        if [ ! -f release-key.jks ]; then
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias ios-calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "iOSCalcRelease2025" \
            -keypass "iOSCalcRelease2025" \
            -dname "CN=iOS Calculator, OU=Mobile, O=AppDev, L=City, S=State, C=US"
        fi

    - name: Build Release APK
      run: gradle :app:assembleRelease --stacktrace --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Calculator-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30